[package]
name = "p2p-net"
version = "0.1.0"
edition = "2024"

[dependencies]
libp2p = { version = "0.53", features = [
    "tokio", "tcp", "noise", "yamux",
    "gossipsub", "kad", "identify", "ping",
    "mdns",    # local peer discovery — great for dev
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tracing = "0.1"
tracing-subscriber = "0.3"

